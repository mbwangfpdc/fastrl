# Interaction config for the SkyRL-SQL workload.
#
# Referenced via:
#   actor_rollout_ref.rollout.multi_turn.interaction_config_path=examples/sql/interaction_config.yaml
#
# `name` is what a sample selects through extra_info.interaction_kwargs.name.
# Leave multi_turn.tool_config_path unset: SkyRL-SQL uses raw <sql> tags, not
# JSON tool calls, so no function-call parser should be installed.
interaction:
  - name: sql
    class_name: verl.interactions.sql_interaction.SQLInteraction
    config:
      # Root of the text2sql database tree: the directory holding
      # SynSQL-2.5M/, spider/ and bird/. This is node-specific, so it is read
      # from the environment rather than hardcoded -- grpo_sql_baseline.sh
      # exports SKYRL_SQL_DB_PATH, picking the first known root that exists on
      # this machine. Hardcoding it here meant the file had to be edited on
      # every migration, and a stale path fails deep in a rollout as
      # "Database file not found", long after the run looks healthy.
      db_path: ${oc.env:SKYRL_SQL_DB_PATH}
      # Assistant-turn budget when a sample carries no `max_turns` of its own.
      # Keep actor_rollout_ref.rollout.multi_turn.max_assistant_turns strictly
      # greater than this so the env, not verl, decides when an episode ends.
      max_turns: 5
      default_task: synsql
